<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mocha Tests</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./mocha.css" />
  </head>
  <body>
    <div id="mocha"></div>
    <script src="./chai.js"></script>
    <script src="./mocha.js"></script>

    <script class="mocha-init">
      mocha.setup('bdd');
      mocha.checkLeaks();
    </script>
    <script src="../dist/boho.min.js"></script>
    <script>

    let assert = chai.assert;
    const RAND = Boho.RAND
    const Buffer = Boho.Buffer;
    const expect = chai.expect

    describe('RAND browser', function () {
      it('returns size bytes', function () {
        expect(RAND(8).length).to.equal(8)
      })
    })

    describe('ENC_PACK (Ascon)', function () {
      it('decryptPack().data is the original data', function () {
        const boho = new Boho()
        boho.set_key('key')
        const decObj = boho.decryptPack(boho.encryptPack('aaaaa'))
        expect(Buffer.from(decObj.data).toString()).to.equal('aaaaa')
      })
      it('decrypt_e2e with another key fails', function () {
        const boho = new Boho()
        expect(boho.decrypt_e2e(boho.encrypt_e2e('x', 'a'), 'b')).to.equal(undefined)
      })
    })

    describe('AUTH process (Ascon)', function () {
      it('client and server log in and exchange messages', function () {
        const server = new Boho(); server.copy_key(Boho.deriveKey('secret'))
        const client = new Boho(); client.set_id_key('dev1.secret')
        const res = server.verify_auth_req(client.auth_req(server.server_time_nonce()))
        expect(res).to.be.ok
        expect(client.verify_auth_res(res)).to.equal(true)
        const up = client.encrypt_session('hello')
        expect(Buffer.from(server.decrypt_session(up)).toString()).to.equal('hello')
        const down = server.encrypt_session('world')
        expect(Buffer.from(client.decrypt_session(down)).toString()).to.equal('world')
      })
    })

  </script>

    <script class="mocha-exec">
      mocha.run();
    </script>
  </body>
</html>
