name: Browser tests Pages
on:
  push:
    branches: [main]
    paths:
      - 'test-browser/**'
      - 'src/**'
      - 'lib/**'
      - 'dist/**'
      - 'package*.json'
      - 'rollup.config.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - uses: actions/configure-pages@v5
      - name: Assemble browser test site
        run: |
          mkdir -p _site/dist
          cp -R test-browser _site/test-browser
          cp dist/boho.js dist/boho.min.js _site/dist/
          printf '%s\n' '<!doctype html><html lang="en"><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=./test-browser/"><title>Boho browser tests</title><a href="./test-browser/">Open browser tests</a></html>' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
